<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>CC-Web</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
  <link rel="apple-touch-icon" href="favicon-512.png">
  <script>
    (function () {
      var theme = localStorage.getItem('cc-web-theme') || 'washi';
      var font = localStorage.getItem('cc-web-font');
      if (!font) {
        font = theme === 'coolvibe' ? 'mono' : (theme === 'editorial' ? 'modern' : 'system');
      }
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.font = font;
    })();
  </script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
</head>
<body>
  <!-- Login -->
  <div id="login-overlay" class="login-overlay">
    <div class="login-box">
      <div class="login-logo">CC</div>
      <h2>CC-Web</h2>
      <p>CLI Agent Web Chat</p>
      <form id="login-form">
        <input type="password" id="login-password" placeholder="输入密码" autocomplete="current-password" autofocus>
        <label class="remember-label">
          <input type="checkbox" id="remember-pw"> 记住密码
        </label>
        <button type="submit">登录</button>
      </form>
      <div id="login-error" class="login-error" hidden>密码错误</div>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="app" hidden>
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="new-chat-split">
          <button id="new-chat-btn" class="new-chat-btn">+ 新会话</button>
          <button id="new-chat-arrow" class="new-chat-arrow" title="更多">▾</button>
        </div>
        <div id="new-chat-dropdown" class="new-chat-dropdown" hidden></div>
        <div class="session-bulk-actions" id="session-bulk-actions">
          <button id="session-multiselect-btn" class="session-bulk-btn" type="button">多选</button>
          <button id="session-select-all-btn" class="session-bulk-btn" type="button" hidden>全选</button>
          <button id="session-invert-select-btn" class="session-bulk-btn" type="button" hidden>反选</button>
          <button id="session-clear-btn" class="session-bulk-btn" type="button">清空</button>
        </div>
      </div>
      <div id="session-list" class="session-list"></div>
      <div class="sidebar-footer">
        <button id="settings-btn" class="settings-btn" title="设置">⚙</button>
        <span class="brand">CC-Web</span>
      </div>
    </aside>

    <div id="sidebar-overlay" class="sidebar-overlay" hidden></div>

    <!-- Chat -->
    <main class="chat-main">
      <header class="chat-header">
        <div class="chat-header-top">
          <div class="chat-header-main">
            <button id="menu-btn" class="menu-btn" title="菜单">☰</button>
            <span id="chat-title" class="chat-title">新会话</span>
          </div>
          <div class="chat-header-actions">
            <button id="git-changes-btn" class="chat-header-chip-btn git-changes-btn" type="button" title="查看 Git 变更">
              <span>Git 变更</span>
              <span id="git-changes-count" class="git-changes-count" hidden>0</span>
            </button>
            <span id="cost-display" class="cost-display" hidden></span>
          </div>
        </div>
        <div id="chat-cwd-row" class="chat-header-bottom" hidden>
          <span id="chat-runtime-state" class="chat-runtime-state" hidden>运行中</span>
          <span id="chat-codebuddy-profile" class="chat-codebuddy-profile" hidden></span>
          <span id="chat-cwd" class="chat-cwd" hidden></span>
        </div>
      </header>

      <div class="messages-wrap">
        <div id="messages" class="messages">
          <div class="welcome-msg">
            <div class="welcome-icon">✿</div>
            <h3>欢迎使用 CC-Web</h3>
            <p>开始与 Agent 对话</p>
          </div>
        </div>
        <div class="custom-scrollbar" id="custom-scrollbar">
          <div class="custom-scrollbar-thumb" id="custom-scrollbar-thumb"></div>
        </div>
      </div>

      <!-- Slash command menu -->
      <div id="cmd-menu" class="cmd-menu" hidden></div>

      <div class="input-area">
        <div id="attachment-tray" class="attachment-tray" hidden></div>
        <div class="input-wrapper">
          <input id="image-upload-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
          <button id="attach-btn" class="attach-btn" title="上传图片" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-8.49 8.49a6 6 0 1 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
            </svg>
          </button>
          <select id="mode-select" class="mode-select" title="权限模式">
            <option value="yolo">YOLO</option>
            <option value="default">默认</option>
            <option value="plan">Plan</option>
          </select>
          <textarea id="msg-input" rows="1" placeholder="输入消息… 输入 / 查看指令" autocomplete="off"></textarea>
          <div class="input-agent-controls">
            <span id="chat-context-row" class="chat-context-row" hidden>
              <span id="chat-context-label" class="chat-context-label" hidden>上下文占用估算</span>
              <span id="chat-context-progress" class="chat-context-progress" aria-hidden="true">
                <span id="chat-context-progress-bar" class="chat-context-progress-bar"></span>
              </span>
              <span id="chat-context-text" class="chat-context-text"></span>
            </span>
            <button id="model-picker-btn" class="chat-header-chip-btn input-model-btn" type="button" title="切换模型">Opus</button>
            <button id="thinking-picker-btn" class="chat-header-chip-btn chat-thinking-btn" type="button" title="切换思考强度" hidden>默认思考</button>
          </div>
          <button id="send-btn" class="send-btn" title="发送">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
          <button id="abort-btn" class="abort-btn" title="停止" hidden>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="6" width="12" height="12" rx="2"></rect>
            </svg>
          </button>
        </div>
      </div>
    </main>

    <aside id="git-panel" class="git-panel" hidden aria-label="Git 变更">
      <header class="git-panel-header">
        <div class="git-panel-heading">
          <strong>Git 变更</strong>
          <span id="git-branch" class="git-branch"></span>
        </div>
        <div class="git-panel-actions">
          <button id="git-refresh-btn" class="git-panel-icon-btn" type="button" title="刷新 Git 变更">&#8635;</button>
          <button id="git-close-btn" class="git-panel-icon-btn" type="button" title="关闭 Git 变更">&#215;</button>
        </div>
      </header>
      <div class="workspace-tabs" role="tablist" aria-label="工作区视图">
        <button class="workspace-tab active" type="button" data-workspace-tab="changes" role="tab" aria-selected="true">Git 变更</button>
        <button class="workspace-tab" type="button" data-workspace-tab="files" role="tab" aria-selected="false">全部文件</button>
      </div>
      <div id="git-panel-body" class="git-panel-body">
        <div class="git-panel-empty">打开一个项目会话后查看变更</div>
      </div>
    </aside>
  </div>

  <div id="session-loading-overlay" class="session-loading-overlay" hidden aria-live="polite" aria-hidden="true">
    <div class="session-loading-card" role="status" aria-busy="true">
      <div class="session-loading-badge">Session</div>
      <div class="session-loading-title">会话加载中</div>
      <div id="session-loading-label" class="session-loading-label">正在整理消息与上下文…</div>
      <div class="session-loading-bar">
        <span class="session-loading-bar-fill"></span>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="/api/agents.js"></script>
  <script src="app.js"></script>
</body>
</html>
